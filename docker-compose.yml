version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# OpsMind local development stack
# ─────────────────────────────────────────────────────────────────────────────

x-backend-env: &backend-env
  DATABASE_URL: "postgresql+asyncpg://opsmind:opsmind@postgres:5432/opsmind"
  REDIS_URL: "redis://redis:6379/0"
  SECRET_KEY: "dev-secret-key-change-in-production-32chars!!"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  ALLOWED_ORIGINS: "http://localhost:3000"
  ENV: "development"
  DEBUG: "true"
  ORCHESTRATOR: "docker"
  DOCKER_NETWORK: "opsmind_lab_net"

services:
  # ── Databases ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opsmind
      POSTGRES_USER: opsmind
      POSTGRES_PASSWORD: opsmind
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "4010:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmind"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "4020:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    environment: *backend-env
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock  # orchestrator needs Docker socket
    ports:
      - "4030:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        /app/.venv/bin/alembic upgrade head &&
        /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
      "

  # ── Celery Worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    environment: *backend-env
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - postgres
    command: /app/.venv/bin/celery -A app.workers.session_cleanup worker -B --loglevel=info

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4040:3000"
    environment:
      VITE_API_URL: "http://localhost:4030"

  # ── Lab network (isolated) ─────────────────────────────────────────────────
  # Created automatically by DockerOrchestrator, but we pre-create it here
  # so compose doesn't complain.

volumes:
  pg_data:
  redis_data:

networks:
  default:
    name: opsmind_default
