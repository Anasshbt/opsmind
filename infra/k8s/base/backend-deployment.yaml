apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsmind-backend
  namespace: opsmind
  labels:
    app: opsmind-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: opsmind-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: opsmind-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: opsmind-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: ghcr.io/yourorg/opsmind-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: opsmind-backend-secret
            - configMapRef:
                name: opsmind-backend-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opsmind-backend
  namespace: opsmind
spec:
  selector:
    app: opsmind-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsmind-backend-sa
  namespace: opsmind
---
# RBAC: backend needs to create/delete pods in opsmind-labs namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opsmind-lab-orchestrator
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opsmind-lab-orchestrator-binding
subjects:
  - kind: ServiceAccount
    name: opsmind-backend-sa
    namespace: opsmind
roleRef:
  kind: ClusterRole
  name: opsmind-lab-orchestrator
  apiGroup: rbac.authorization.k8s.io
